[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchardiq"
version = "0.1.0"
description = "Production-style Agentic Enterprise Analytics Platform for Orchard Inc."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OrchardIQ Engineering Team" }
]
dependencies = [
    "duckdb>=1.1.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "sqlglot>=23.0.0",
    "rich>=13.7.0",
    "pandas>=2.1.0",
    "faker>=24.0.0",
    "chromadb>=0.4.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sse-starlette>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
orchardiq-generate = "src.data_gen.cli:main"
orchardiq-warehouse = "src.warehouse.catalog:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=5"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
