name: OrchardIQ CI Pipeline

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint, TypeCheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff pytest-cov

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/ --ignore E501,F401,E402,F841 || true

      - name: Generate Fast Test Data
        run: |
          python -m src.data_gen.cli --fast

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=src --cov-report=term --durations=10 -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Frontend (Conditional if frontend initialized)
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend
            npm ci || npm install
            npm run build
          else
            echo "Frontend directory not yet initialized; skipping frontend build until Phase 6."
          fi
